<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ولي الأمر | مستكشف</title><link rel="stylesheet" href="/css/style.css"></head><body><header><div class="brand">🧭 مستكشف — ولي الأمر</div><a href="/" class="ytBtn">العودة للموقع</a></header><main><section id="loginBox" class="parentBox"><h1>متابعة مستوى ابنك</h1><p class="muted">سجّل الدخول بالحساب الذي أنشأه لك مدير المنصة.</p><form id="pf"><input id="pe" type="email" placeholder="البريد الإلكتروني" required><input id="pp" type="password" placeholder="كلمة المرور" required><button>دخول ولي الأمر</button></form></section><section id="dash" class="hidden"></section></main><script>
const $=s=>document.querySelector(s);let token=localStorage.getItem('mostakshef_token');async function api(u,o={}){const r=await fetch(u,{...o,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'حدث خطأ');return d}function esc(x){return String(x??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function load(){try{const d=await api('/api/parent/dashboard');$('#loginBox').classList.add('hidden');$('#dash').classList.remove('hidden');$('#dash').innerHTML=`<h1>أهلًا ${esc(d.parent.name)} 👋</h1><div class="stats"><div class="stat">تقدم الدروس<b>${d.child.progressPercent}%</b></div><div class="stat">الدروس المكتملة<b>${d.child.done}/${d.child.totalLessons}</b></div><div class="stat">الاختبارات<b>${d.child.attempts.length}</b></div></div><div class="card"><h2>الطالب: ${esc(d.child.name)}</h2><p>البريد: ${esc(d.child.email)}</p><h3>نتائج الامتحانات</h3>${d.child.attempts.length?d.child.attempts.slice().reverse().map(a=>`<div class="resultRow"><b>${a.percent}%</b><span>${a.passed?'ناجح':'راسب'}</span><small>${new Date(a.at).toLocaleDateString('ar-EG')}</small></div>`).join(''):'<p class="muted">لم يدخل اختبارات بعد.</p>'}<button onclick="localStorage.removeItem('mostakshef_token');location.reload()">تسجيل الخروج</button></div>`}catch(e){alert(e.message);localStorage.removeItem('mostakshef_token')}}$('#pf').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({email:$('#pe').value,password:$('#pp').value})});if(d.user.role!=='parent')throw Error('هذا الحساب ليس حساب ولي أمر');token=d.token;localStorage.setItem('mostakshef_token',token);load()}catch(x){alert(x.message)}};if(token)load();</script></body></html>
